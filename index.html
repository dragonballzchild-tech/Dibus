<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100b07">
  <title>Dibus</title>
  <link rel="preload" href="/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Dibus home">DIBUS</a>
  </header>

  <main class="page">
    <form id="bar" class="searchbar" role="search" autocomplete="off">
      <label class="sr-only" for="q">Search YouTube or paste a link</label>
      <input id="q" name="q" type="text" placeholder="Search YouTube or paste a link" enterkeyhint="go" autocapitalize="off" spellcheck="false">
      <button class="pill" type="submit">Go <span class="pill-arrow" aria-hidden="true">&rarr;</span></button>
    </form>
    <p id="hint" class="hint" role="status" hidden></p>

    <section id="player" class="player" aria-label="Video player" hidden>
      <div id="player-frame" class="player-frame"></div>
      <p id="player-error" class="player-error" role="alert" hidden>This video can&rsquo;t be played here. Open it on YouTube instead.</p>
      <div class="strip">
        <a id="open-yt" class="pill" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">Open on YouTube <span class="pill-arrow" aria-hidden="true">&rarr;</span></a>
      </div>
    </section>

    <section id="results" class="results" aria-label="Search results" hidden>
      <h2 class="section-label">Results</h2>
      <ul id="results-list" class="results-grid"></ul>
      <div class="results-foot">
        <div id="results-sentinel" class="sentinel" aria-hidden="true"></div>
        <p id="results-end" class="results-end" hidden></p>
        <p id="more-error" class="more-error" role="alert" hidden></p>
        <button id="load-more" class="pill" type="button" hidden><span id="load-more-label">Load more</span> <span class="pill-arrow" aria-hidden="true">&rarr;</span></button>
      </div>
    </section>
  </main>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
